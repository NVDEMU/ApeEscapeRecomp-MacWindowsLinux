name: Experimental Wii U build

on:
  push:
    branches: [wiiu-port]
  pull_request:
    branches: [wiiu-port]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wiiu:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BUILD_JOBS: 2

    steps:
      - name: Check out game and pinned runtime
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install host, disc and Wii U toolchains
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build ccache pkg-config mame-tools \
            libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxtst-dev libxfixes-dev libxss-dev libwayland-dev \
            libxkbcommon-dev libasound2-dev libpulse-dev libudev-dev libdrm-dev libgbm-dev
          command -v chdman
          docker --version

      - name: Download and validate the original disc privately
        env:
          GAME_ASSETS_TOKEN: ${{ secrets.GAME_ASSETS_TOKEN }}
          GAME_ASSETS_REPO: NVDEMU/apeescapeprivateassets
          GAME_ASSETS_TAG: thing
          GAME_ASSETS_FILENAME: Ape.Escape.USA.chd
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ape-disc" apeescape
          python3 tools/download_disc.py "$RUNNER_TEMP/Ape Escape (USA).chd"
          chdman verify -i "$RUNNER_TEMP/Ape Escape (USA).chd"

      - name: Build the host recompiler and bundled OpenBIOS
        run: |
          set -euo pipefail
          cmake -S psxrecomp-v4/recompiler -B psxrecomp-v4/recompiler/build-wiiu-host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build psxrecomp-v4/recompiler/build-wiiu-host --parallel "$BUILD_JOBS" \
            --target psxrecomp-game psxrecomp-bios
          (cd psxrecomp-v4 && PSXRECOMP_BIOS_BUILD=recompiler/build-wiiu-host bash tools/regen_bios.sh --config bios/OpenBIOS.toml)

      - name: Prepare the disc and generate Ape Escape C translation
        run: |
          set -euo pipefail
          chdman extractcd \
            -i "$RUNNER_TEMP/Ape Escape (USA).chd" \
            -o "$RUNNER_TEMP/Ape Escape (USA).cue" \
            -ob "$RUNNER_TEMP/Ape Escape (USA).bin"
          python3 psxrecomp-v4/tools/prepare_disc.py "$RUNNER_TEMP/Ape Escape (USA).cue" --config game.toml
          test -s apeescape/SCUS_944.23
          psxrecomp-v4/recompiler/build-wiiu-host/psxrecomp-game --config game.toml
          test -s generated/SCUS_944.23_dispatch.c
          find generated -maxdepth 1 -type f -name 'SCUS_944.23_full*' -size +0c | grep -q .

      - name: Configure and compile native Wii U build in devkitPro container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            devkitpro/devkitppc:latest \
            bash -lc '
              set -euo pipefail
              # The bind-mounted checkout is owned by the host runner UID.
              # Explicitly trust this source tree so revision-pinned patch scripts
              # can verify the nested PSXRecomp submodule while running as container root.
              git config --global --add safe.directory /src
              git config --global --add safe.directory /src/psxrecomp-v4
              git -C /src/psxrecomp-v4 rev-parse --verify HEAD
              # The devkitpro/devkitppc image is already provisioned with
              # wiiu-dev and wiiu-sdl2. Avoid dkp-pacman network sync here:
              # pkg.devkitpro.org may return 403 and the cached image is sufficient.
              command -v elf2rpl
              test -x /opt/devkitpro/portlibs/wiiu/bin/powerpc-eabi-cmake
              /opt/devkitpro/portlibs/wiiu/bin/powerpc-eabi-pkg-config --modversion sdl2
              export DEVKITPRO=/opt/devkitpro
              export WUT_ROOT=/opt/devkitpro/wut
              /opt/devkitpro/portlibs/wiiu/bin/powerpc-eabi-cmake \
                -S /src -B /src/build-wiiu \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_TESTING=OFF \
                -DPSX_RECOMP_UI:BOOL=OFF \
                -DPSX_SETUP_WIZARD:BOOL=OFF \
                -DPSX_DEBUG_TOOLS:BOOL=OFF \
                -DAPE_WIIU_PORT=ON
              if ! cmake --build /src/build-wiiu --parallel 2; then
                echo "::group::Objects still emitting unsupported Cafe OS TLS relocations"
                READELF="$(command -v powerpc-eabi-readelf || command -v readelf)"
                find /src/build-wiiu -type f -name '*.o' -print0 |
                  while IFS= read -r -d '' object; do
                    matches="$("$READELF" -rW "$object" 2>/dev/null | grep -E 'R_PPC_TPREL(16_(HA|LO)|16|32)' || true)"
                    if [ -n "$matches" ]; then
                      printf '\\n== %s ==\\n%s\\n' "$object" "$matches"
                    fi
                  done
                echo "::endgroup::"
                exit 1
              fi
            '

      - name: Verify and stage RPX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wiiu-artifact
          mapfile -t RPX_FILES < <(find build-wiiu -type f -name '*.rpx' -print)
          if [ "${#RPX_FILES[@]}" -eq 0 ]; then
            echo "::error::Build completed without producing a .rpx homebrew executable."
            find build-wiiu -maxdepth 5 -type f | sort | tail -n 100
            exit 1
          fi
          for file in "${RPX_FILES[@]}"; do
            cp "$file" "wiiu-artifact/$(basename "$file")"
          done
          cp docs/WIIU_PORT.md wiiu-artifact/README.txt
          sha256sum wiiu-artifact/*

      - name: Upload Wii U homebrew build
        uses: actions/upload-artifact@v4
        with:
          name: ApeEscapeRecomp-WiiU-${{ github.sha }}
          path: wiiu-artifact/*
          if-no-files-found: error
          retention-days: 14

  cemu-smoke-test:
    name: Cemu RPX smoke test
    needs: build-wiiu
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      CEMU_RELEASE_URL: https://github.com/cemu-project/Cemu/releases/download/v2.6/cemu-2.6-ubuntu-22.04-x64.zip
      CEMU_RELEASE_SHA256: 5e4592d0dae394fa0614cb8c875eff3f81b23170b349511de318d9caf7215e1b
    steps:
      - name: Check out disc downloader
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download built RPX artifact
        uses: actions/download-artifact@v4
        with:
          name: ApeEscapeRecomp-WiiU-${{ github.sha }}
          path: wiiu-artifact

      - name: Install Cemu display and software Vulkan dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb xauth unzip curl mame-tools \
            libvulkan1 mesa-vulkan-drivers libgtk-3-0t64 libpulse0 \
            libsecret-1-0 libxkbcommon0 libglu1-mesa libgdk-pixbuf-2.0-0

      - name: Download and verify Cemu
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cemu"
          curl --fail --location --silent --show-error "$CEMU_RELEASE_URL" \
            -o "$RUNNER_TEMP/cemu.zip"
          echo "$CEMU_RELEASE_SHA256  $RUNNER_TEMP/cemu.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/cemu.zip" -d "$RUNNER_TEMP/cemu"
          CEMU_BIN="$(find "$RUNNER_TEMP/cemu" -type f -perm -u+x \
            \( -name Cemu -o -name cemu \) -print -quit)"
          if [ -z "$CEMU_BIN" ]; then
            echo "::error::Could not find the Cemu executable in the verified release archive."
            find "$RUNNER_TEMP/cemu" -maxdepth 3 -type f | sort | head -n 100
            exit 1
          fi
          echo "CEMU_BIN=$CEMU_BIN" >> "$GITHUB_ENV"
          mkdir -p "$(dirname "$CEMU_BIN")/portable" "$(dirname "$CEMU_BIN")/mlc01"
          "$CEMU_BIN" --version || true

      - name: Download original disc privately for virtual SD mount
        env:
          GAME_ASSETS_TOKEN: ${{ secrets.GAME_ASSETS_TOKEN }}
          GAME_ASSETS_REPO: NVDEMU/apeescapeprivateassets
          GAME_ASSETS_TAG: thing
          GAME_ASSETS_FILENAME: Ape.Escape.USA.chd
        run: |
          set -euo pipefail
          python3 tools/download_disc.py "$RUNNER_TEMP/Ape Escape (USA).chd"
          chdman verify -i "$RUNNER_TEMP/Ape Escape (USA).chd"
          mkdir -p "$RUNNER_TEMP/cemu-sd/wiiu/apeescape"
          chdman extractcd \
            -i "$RUNNER_TEMP/Ape Escape (USA).chd" \
            -o "$RUNNER_TEMP/Ape Escape (USA).cue" \
            -ob "$RUNNER_TEMP/Ape Escape (USA).bin"
          cp "$RUNNER_TEMP/Ape Escape (USA).cue" "$RUNNER_TEMP/cemu-sd/wiiu/apeescape/"
          cp "$RUNNER_TEMP/Ape Escape (USA).bin" "$RUNNER_TEMP/cemu-sd/wiiu/apeescape/"

      - name: Launch RPX in Cemu for 30-second smoke test
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t RPX_FILES < <(find wiiu-artifact -maxdepth 1 -type f -name '*.rpx' -print)
          if [ "${#RPX_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one RPX artifact, found ${#RPX_FILES[@]}."
            ls -la wiiu-artifact
            exit 1
          fi
          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          set +e
          timeout --signal=TERM --kill-after=8s 30s xvfb-run -a \
            --server-args="-screen 0 1280x720x24" \
            "$CEMU_BIN" -g "${RPX_FILES[0]}" \
            --cos-mounts "$RUNNER_TEMP/cemu-sd:/vol/external01/" \
            --forward-console-logging > "$RUNNER_TEMP/cemu-smoke.log" 2>&1
          CEMU_EXIT=$?
          set -e
          cat "$RUNNER_TEMP/cemu-smoke.log"
          if [ "$CEMU_EXIT" -ne 124 ] && [ "$CEMU_EXIT" -ne 137 ]; then
            echo "::error::Cemu did not remain running for the 30-second RPX smoke test (exit $CEMU_EXIT)."
            exit 1
          fi
          echo "Cemu stayed alive for the 30-second RPX smoke window with the virtual SD mount."
