name: Experimental Wii U build

on:
  push:
    branches: [wiiu-port]
  pull_request:
    branches: [wiiu-port]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wiiu:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BUILD_JOBS: 2

    steps:
      - name: Check out game and pinned runtime
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install host, disc and Wii U toolchains
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build ccache pkg-config mame-tools \
            libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxtst-dev libxfixes-dev libxss-dev libwayland-dev \
            libxkbcommon-dev libasound2-dev libpulse-dev libudev-dev libdrm-dev libgbm-dev
          command -v chdman
          docker --version

      - name: Download and validate the original disc privately
        env:
          GAME_ASSETS_TOKEN: ${{ secrets.GAME_ASSETS_TOKEN }}
          GAME_ASSETS_REPO: NVDEMU/apeescapeprivateassets
          GAME_ASSETS_TAG: thing
          GAME_ASSETS_FILENAME: Ape.Escape.USA.chd
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ape-disc" apeescape
          python3 tools/download_disc.py "$RUNNER_TEMP/Ape Escape (USA).chd"
          chdman verify -i "$RUNNER_TEMP/Ape Escape (USA).chd"

      - name: Build the host recompiler and bundled OpenBIOS
        run: |
          set -euo pipefail
          cmake -S psxrecomp-v4/recompiler -B psxrecomp-v4/recompiler/build-wiiu-host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build psxrecomp-v4/recompiler/build-wiiu-host --parallel "$BUILD_JOBS" \
            --target psxrecomp-game psxrecomp-bios
          (cd psxrecomp-v4 && PSXRECOMP_BIOS_BUILD=recompiler/build-wiiu-host bash tools/regen_bios.sh --config bios/OpenBIOS.toml)

      - name: Prepare the disc and generate Ape Escape C translation
        run: |
          set -euo pipefail
          chdman extractcd \
            -i "$RUNNER_TEMP/Ape Escape (USA).chd" \
            -o "$RUNNER_TEMP/Ape Escape (USA).cue" \
            -ob "$RUNNER_TEMP/Ape Escape (USA).bin"
          python3 psxrecomp-v4/tools/prepare_disc.py "$RUNNER_TEMP/Ape Escape (USA).cue" --config game.toml
          test -s apeescape/SCUS_944.23
          psxrecomp-v4/recompiler/build-wiiu-host/psxrecomp-game --config game.toml
          test -s generated/SCUS_944.23_dispatch.c
          find generated -maxdepth 1 -type f -name 'SCUS_944.23_full*' -size +0c | grep -q .

      - name: Configure and compile native Wii U build in devkitPro container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            devkitpro/devkitppc:latest \
            bash -lc '
              set -euo pipefail
              # The bind-mounted checkout is owned by the host runner UID.
              # Explicitly trust this source tree so revision-pinned patch scripts
              # can verify the nested PSXRecomp submodule while running as container root.
              git config --global --add safe.directory /src
              git config --global --add safe.directory /src/psxrecomp-v4
              git -C /src/psxrecomp-v4 rev-parse --verify HEAD
              # The devkitpro/devkitppc image is already provisioned with
              # wiiu-dev and wiiu-sdl2. Avoid dkp-pacman network sync here:
              # pkg.devkitpro.org may return 403 and the cached image is sufficient.
              command -v elf2rpl
              test -x /opt/devkitpro/portlibs/wiiu/bin/powerpc-eabi-cmake
              /opt/devkitpro/portlibs/wiiu/bin/powerpc-eabi-pkg-config --modversion sdl2
              export DEVKITPRO=/opt/devkitpro
              export WUT_ROOT=/opt/devkitpro/wut
              /opt/devkitpro/portlibs/wiiu/bin/powerpc-eabi-cmake \
                -S /src -B /src/build-wiiu \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_TESTING=OFF \
                -DPSX_RECOMP_UI:BOOL=OFF \
                -DPSX_SETUP_WIZARD:BOOL=OFF \
                -DPSX_DEBUG_TOOLS:BOOL=OFF \
                -DAPE_WIIU_PORT=ON
              if ! cmake --build /src/build-wiiu --parallel 2; then
                echo "::group::Objects still emitting unsupported Cafe OS TLS relocations"
                READELF="$(command -v powerpc-eabi-readelf || command -v readelf)"
                find /src/build-wiiu -type f -name "*.o" -print |
                  while IFS= read -r object; do
                    matches="$("$READELF" -rW "$object" 2>/dev/null | grep -E "R_PPC_TPREL(16_(HA|LO)|16|32)" || true)"
                    if [ -n "$matches" ]; then
                      printf "\\n== %s ==\\n%s\\n" "$object" "$matches"
                    fi
                  done
                echo "::endgroup::"
                exit 1
              fi
            '

      - name: Verify and stage RPX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wiiu-artifact
          mapfile -t RPX_FILES < <(find build-wiiu -type f -name '*.rpx' -print)
          if [ "${#RPX_FILES[@]}" -eq 0 ]; then
            echo "::error::Build completed without producing a .rpx homebrew executable."
            find build-wiiu -maxdepth 5 -type f | sort | tail -n 100
            exit 1
          fi
          for file in "${RPX_FILES[@]}"; do
            cp "$file" "wiiu-artifact/$(basename "$file")"
          done

          # An RPX is not a self-contained game package: the runtime resolves
          # game.toml next to argv[0], and OpenBIOS + the default mod catalog
          # are staged beside the target by psxrecomp_add_runtime_target().
          # Copy these non-game assets into the artifact or Cemu starts the
          # bare runtime without this title's game configuration and BIOS.
          cp game.toml wiiu-artifact/game.toml
          RUNTIME_DIR="$(dirname "${RPX_FILES[0]}")"
          for sidecar in bios mods assets; do
            SIDE_DIR="$RUNTIME_DIR/$sidecar"
            if [ ! -d "$SIDE_DIR" ] && [ -d "build-wiiu/$sidecar" ]; then
              SIDE_DIR="build-wiiu/$sidecar"
            fi
            if [ -d "$SIDE_DIR" ]; then
              cp -R "$SIDE_DIR" "wiiu-artifact/$sidecar"
            fi
          done

          # These two are required by the runtime's default BIOS resolver.
          test -s wiiu-artifact/bios/openbios.bin
          test -s wiiu-artifact/bios/OpenBIOS.LICENSE
          test -s wiiu-artifact/game.toml
          cp docs/WIIU_PORT.md wiiu-artifact/README.txt
          find wiiu-artifact -type f -print0 | sort -z | xargs -0 sha256sum

      - name: Upload Wii U homebrew build
        uses: actions/upload-artifact@v4
        with:
          name: ApeEscapeRecomp-WiiU-${{ github.sha }}
          path: wiiu-artifact/*
          if-no-files-found: error
          retention-days: 14

  cemu-smoke-test:
    name: Cemu RPX smoke test
    needs: build-wiiu
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # Pin the upstream Cemu source commit that implements --cos-mounts.
      # Official v2.6 does not recognize that launch option, which caused the
      # emulated SD paths to remain absent in earlier smoke tests.
      CEMU_SOURCE_SHA: a53cf0ece75964aa361056edab46f281dcc0bc44
    steps:
      - name: Check out disc downloader
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download built RPX artifact
        uses: actions/download-artifact@v4
        with:
          name: ApeEscapeRecomp-WiiU-${{ github.sha }}
          path: wiiu-artifact

      - name: Install Cemu build and display dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake g++ freeglut3-dev \
            git libbluetooth-dev libgcrypt20-dev libglm-dev libgtk-3-dev \
            libpulse-dev libsecret-1-dev libsystemd-dev libtool libudev-dev nasm ninja-build \
            libusb-1.0-0-dev xvfb xauth mame-tools libvulkan1 mesa-vulkan-drivers \
            libpulse0 libsecret-1-0 libxkbcommon0 libglu1-mesa \
            libgdk-pixbuf-2.0-0 imagemagick

      - name: Build pinned Cemu source with COS mount support
        shell: bash
        run: |
          set -euo pipefail
          CEMU_SOURCE_DIR="$RUNNER_TEMP/cemu-source"
          CEMU_BUILD_DIR="$CEMU_SOURCE_DIR/build"
          git init "$CEMU_SOURCE_DIR"
          git -C "$CEMU_SOURCE_DIR" remote add origin https://github.com/cemu-project/Cemu.git
          git -C "$CEMU_SOURCE_DIR" fetch --depth 1 origin "$CEMU_SOURCE_SHA"
          git -C "$CEMU_SOURCE_DIR" checkout --detach FETCH_HEAD
          git -C "$CEMU_SOURCE_DIR" submodule update --init --recursive --depth 1

          # Do not silently fall back to a released build without COS mounts.
          if ! grep -q '("cos-mounts"' "$CEMU_SOURCE_DIR/src/config/LaunchSettings.cpp"; then
            echo "::error::Pinned Cemu source does not expose the required --cos-mounts option."
            exit 1
          fi

          cmake -S "$CEMU_SOURCE_DIR" -B "$CEMU_BUILD_DIR" \
            -DCMAKE_BUILD_TYPE=release \
            -DCMAKE_C_COMPILER=/usr/bin/gcc \
            -DCMAKE_CXX_COMPILER=/usr/bin/g++ \
            -G Ninja
          cmake --build "$CEMU_BUILD_DIR" --parallel 2

          CEMU_BIN="$CEMU_SOURCE_DIR/bin/Cemu_release"
          if [ ! -x "$CEMU_BIN" ]; then
            CEMU_BIN="$(find "$CEMU_SOURCE_DIR" -type f \
              \( -name Cemu_release -o -name Cemu \) -executable -print -quit)"
          fi
          if [ -z "$CEMU_BIN" ] || [ ! -x "$CEMU_BIN" ]; then
            echo "::error::Could not find the Cemu binary after the source build."
            find "$CEMU_SOURCE_DIR" -maxdepth 4 -type f -name 'Cemu*' -print | head -n 100
            exit 1
          fi

          if ! ldd "$CEMU_BIN" > "$RUNNER_TEMP/cemu-ldd.txt"; then
            cat "$RUNNER_TEMP/cemu-ldd.txt"
            exit 1
          fi
          cat "$RUNNER_TEMP/cemu-ldd.txt"
          if grep -q "not found" "$RUNNER_TEMP/cemu-ldd.txt"; then
            echo "::error::Cemu has missing shared libraries."
            exit 1
          fi
          echo "CEMU_BIN=$CEMU_BIN" >> "$GITHUB_ENV"

          # Prevent the first-run wizard from blocking the RPX launch.
          CEMU_PORTABLE="$(dirname "$CEMU_BIN")/portable"
          CEMU_MLC="$CEMU_PORTABLE/mlc01"
          mkdir -p "$CEMU_PORTABLE" "$CEMU_MLC" "$CEMU_PORTABLE/controllerProfiles"
          cat > "$CEMU_PORTABLE/settings.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <content>
            <mlc_path>$CEMU_MLC</mlc_path>
            <GamePaths/>
          </content>
          EOF
          test -s "$CEMU_PORTABLE/settings.xml"
          python3 - "$CEMU_PORTABLE/settings.xml" "$CEMU_MLC" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          assert root.tag == "content", f"unexpected Cemu config root: {root.tag}"
          assert root.findtext("mlc_path") == sys.argv[2], "Cemu MLC path was not saved"
          print(f"Seeded Cemu portable configuration: {sys.argv[1]}")
          print(f"Cemu MLC path: {sys.argv[2]}")
          PY
          "$CEMU_BIN" --version

      - name: Download original disc privately for virtual SD mount
        env:
          GAME_ASSETS_TOKEN: ${{ secrets.GAME_ASSETS_TOKEN }}
          GAME_ASSETS_REPO: NVDEMU/apeescapeprivateassets
          GAME_ASSETS_TAG: thing
          GAME_ASSETS_FILENAME: Ape.Escape.USA.chd
        run: |
          set -euo pipefail
          python3 tools/download_disc.py "$RUNNER_TEMP/Ape Escape (USA).chd"
          chdman verify -i "$RUNNER_TEMP/Ape Escape (USA).chd"
          mkdir -p "$RUNNER_TEMP/cemu-sd/wiiu/apeescape"
          # Direct RPX launches in Cemu do not reliably expose the host artifact
          # directory as argv[0]. Mirror the normal SD app layout so the Wii U
          # runtime can locate game.toml and OpenBIOS via /vol/external01.
          APP_SD="$RUNNER_TEMP/cemu-sd/wiiu/apps/ApeEscapeRecomp"
          mkdir -p "$APP_SD"
          cp wiiu-artifact/game.toml "$APP_SD/game.toml"
          cp -R wiiu-artifact/bios "$APP_SD/bios"
          cp -R wiiu-artifact/mods "$APP_SD/mods"
          cp -R wiiu-artifact/assets "$APP_SD/assets"
          chdman extractcd \
            -i "$RUNNER_TEMP/Ape Escape (USA).chd" \
            -o "$RUNNER_TEMP/Ape Escape (USA).cue" \
            -ob "$RUNNER_TEMP/Ape Escape (USA).bin"
          cp "$RUNNER_TEMP/Ape Escape (USA).cue" "$RUNNER_TEMP/cemu-sd/wiiu/apeescape/"
          cp "$RUNNER_TEMP/Ape Escape (USA).bin" "$RUNNER_TEMP/cemu-sd/wiiu/apeescape/"

      - name: Build known-good Wii U Hello World control RPX
        shell: bash
        run: |
          set -euo pipefail
          CONTROL_SRC="$RUNNER_TEMP/wiiu-hello-world"
          CONTROL_BUILD="$RUNNER_TEMP/wiiu-hello-world-build"
          git clone --depth 1 https://github.com/MatthewL246/wiiu-hello-world.git "$CONTROL_SRC"
          mkdir -p "$CONTROL_BUILD"
          docker run --rm \
            -v "$CONTROL_SRC:/control-src" \
            -v "$CONTROL_BUILD:/control-build" \
            -w /control-build \
            devkitpro/devkitppc:latest \
            bash -lc '
              set -euo pipefail
              export DEVKITPRO=/opt/devkitpro
              export WUT_ROOT=/opt/devkitpro/wut
              /opt/devkitpro/portlibs/wiiu/bin/powerpc-eabi-cmake \
                -S /control-src -B /control-build \
                -DCMAKE_BUILD_TYPE=Release
              cmake --build /control-build --parallel 2
              test -s /control-build/helloworld.rpx
            '
          cp "$CONTROL_BUILD/helloworld.rpx" "$RUNNER_TEMP/helloworld-control.rpx"
          sha256sum "$RUNNER_TEMP/helloworld-control.rpx"

      - name: Run Hello World control in Cemu and capture display
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cemu-test-output"
          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          export CONTROL_RPX="$RUNNER_TEMP/helloworld-control.rpx"
          export CONTROL_OUT="$RUNNER_TEMP/cemu-test-output"
          set +e
          timeout --signal=TERM --kill-after=5s 25s xvfb-run -a \
            --server-args="-screen 0 1280x720x24" \
            bash <<'CONTROL_TEST_SCRIPT'
              set -uo pipefail
              "$CEMU_BIN" -g "$CONTROL_RPX" --forward-console-logging \
                > "$CONTROL_OUT/hello-world-cemu.log" 2>&1 &
              CEMU_PID=$!
              echo "Started Cemu control RPX (PID $CEMU_PID)"
              sleep 12
              if kill -0 "$CEMU_PID" 2>/dev/null; then
                import -window root -silent "$CONTROL_OUT/hello-world-after-12s.png" \
                  2> "$CONTROL_OUT/hello-world-screenshot-errors.log" || true
                kill -TERM "$CEMU_PID" 2>/dev/null || true
                sleep 2
                kill -KILL "$CEMU_PID" 2>/dev/null || true
                wait "$CEMU_PID" 2>/dev/null || true
              else
                wait "$CEMU_PID"
                status=$?
                echo "Cemu exited before control screenshot (exit $status)"
                exit "$status"
              fi
          CONTROL_TEST_SCRIPT
          CONTROL_EXIT=$?
          set -e
          echo "Hello World Cemu wrapper exit: $CONTROL_EXIT" | tee "$RUNNER_TEMP/cemu-test-output/hello-world-summary.txt"
          if [ -f "$RUNNER_TEMP/cemu-test-output/hello-world-cemu.log" ]; then
            grep -Ein 'error|warning|fail|exception|crash|DRI3|Vulkan|OpenGL|GX2|RPX|Cafe|unsupported' \
              "$RUNNER_TEMP/cemu-test-output/hello-world-cemu.log" \
              >> "$RUNNER_TEMP/cemu-test-output/hello-world-summary.txt" || true
          fi
          if [ -f "$RUNNER_TEMP/cemu-test-output/hello-world-after-12s.png" ]; then
            identify -format 'Hello World screenshot: %wx%h colors=%k mean=%[fx:mean] standard_deviation=%[fx:standard_deviation]\\n' \
              "$RUNNER_TEMP/cemu-test-output/hello-world-after-12s.png" \
              | tee -a "$RUNNER_TEMP/cemu-test-output/hello-world-summary.txt"
          else
            echo "No Hello World screenshot was captured." | tee -a "$RUNNER_TEMP/cemu-test-output/hello-world-summary.txt"
          fi
          # The control is diagnostic, so retain its evidence even if Cemu fails.
          # A Cemu control failure should fail the job: otherwise the baseline
          # could silently disappear and make the comparison misleading.
          if [ "$CONTROL_EXIT" -ne 0 ]; then
            echo "::error::Cemu Hello World control test failed."
            exit "$CONTROL_EXIT"
          fi

      - name: Build SDL2 video control RPX
        shell: bash
        run: |
          set -euo pipefail
          SDL_CONTROL_SRC="$RUNNER_TEMP/wiiu-sdl2-control"
          SDL_CONTROL_BUILD="$RUNNER_TEMP/wiiu-sdl2-control-build"
          mkdir -p "$SDL_CONTROL_SRC" "$SDL_CONTROL_BUILD"
          cat > "$SDL_CONTROL_SRC/CMakeLists.txt" <<'SDL_CMAKE'
          cmake_minimum_required(VERSION 3.2)
          set(CMAKE_TOOLCHAIN_FILE $ENV{DEVKITPRO}/cmake/WiiU.cmake)
          project(sdl2_control C)
          set(PKG_CONFIG_EXECUTABLE "/opt/devkitpro/portlibs/wiiu/bin/powerpc-eabi-pkg-config" CACHE FILEPATH "" FORCE)
          find_package(PkgConfig REQUIRED)
          pkg_check_modules(SDL2 REQUIRED IMPORTED_TARGET sdl2)
          add_executable(sdl2-control main.c)
          target_compile_options(sdl2-control PRIVATE -Wall -Wextra)
          target_link_libraries(sdl2-control PRIVATE PkgConfig::SDL2)
          wut_create_rpx(sdl2-control)
          SDL_CMAKE
          cat > "$SDL_CONTROL_SRC/main.c" <<'SDL_MAIN'
          #include <stdint.h>
          #include <stdio.h>
          #include <SDL.h>
          #include <coreinit/thread.h>
          #include <whb/log.h>
          #include <whb/log_console.h>
          #include <whb/proc.h>

          static void show_error(const char *stage, const char *detail)
          {
              WHBLogPrintf("SDL2 control: %s failed: %s", stage, detail ? detail : "unknown error");
              WHBLogConsoleDraw();
              while (WHBProcIsRunning())
                  OSSleepTicks(OSMillisecondsToTicks(250));
          }

          int main(void)
          {
              WHBProcInit();
              WHBLogConsoleInit();
              WHBLogPrint("SDL2 video/texture test starting...");
              WHBLogConsoleDraw();

              if (SDL_Init(SDL_INIT_VIDEO) != 0) {
                  show_error("SDL_Init(SDL_INIT_VIDEO)", SDL_GetError());
                  SDL_Quit(); WHBLogConsoleFree(); WHBProcShutdown(); return 2;
              }

              SDL_Window *window = SDL_CreateWindow("Ape Escape SDL2 control",
                  SDL_WINDOWPOS_CENTERED, SDL_WINDOWPOS_CENTERED, 854, 480, SDL_WINDOW_SHOWN);
              if (!window) {
                  show_error("SDL_CreateWindow", SDL_GetError());
                  SDL_Quit(); WHBLogConsoleFree(); WHBProcShutdown(); return 3;
              }

              SDL_Renderer *renderer = SDL_CreateRenderer(window, -1, SDL_RENDERER_SOFTWARE);
              if (!renderer) {
                  show_error("SDL_CreateRenderer(software)", SDL_GetError());
                  SDL_DestroyWindow(window); SDL_Quit(); WHBLogConsoleFree(); WHBProcShutdown(); return 4;
              }

              SDL_PixelFormat *format = SDL_AllocFormat(SDL_PIXELFORMAT_ARGB8888);
              SDL_Texture *texture = SDL_CreateTexture(renderer, SDL_PIXELFORMAT_ARGB8888,
                  SDL_TEXTUREACCESS_STREAMING, 320, 240);
              if (!format || !texture) {
                  show_error("SDL texture setup", SDL_GetError());
                  if (texture) SDL_DestroyTexture(texture);
                  if (format) SDL_FreeFormat(format);
                  SDL_DestroyRenderer(renderer); SDL_DestroyWindow(window);
                  SDL_Quit(); WHBLogConsoleFree(); WHBProcShutdown(); return 5;
              }

              static Uint32 pixels[320 * 240];
              for (int y = 0; y < 240; ++y) {
                  for (int x = 0; x < 320; ++x) {
                      pixels[y * 320 + x] = SDL_MapRGBA(format,
                          (Uint8)((x * 255) / 319), (Uint8)((y * 255) / 239),
                          (Uint8)(((x / 16) ^ (y / 16)) & 1 ? 240 : 30), 255);
                  }
              }
              WHBLogPrint("SDL2 initialized; streaming texture upload and render loop starting.");
              WHBLogConsoleFree();

              int quit = 0;
              while (!quit && WHBProcIsRunning()) {
                  SDL_Event event;
                  while (SDL_PollEvent(&event))
                      if (event.type == SDL_QUIT) quit = 1;
                  SDL_UpdateTexture(texture, NULL, pixels, 320 * (int)sizeof(Uint32));
                  SDL_SetRenderDrawColor(renderer, 0, 0, 0, 255);
                  SDL_RenderClear(renderer);
                  SDL_RenderCopy(renderer, texture, NULL, NULL);
                  SDL_RenderPresent(renderer);
                  SDL_Delay(16);
              }

              SDL_DestroyTexture(texture); SDL_FreeFormat(format);
              SDL_DestroyRenderer(renderer); SDL_DestroyWindow(window);
              SDL_Quit(); WHBProcShutdown();
              return 0;
          }
          SDL_MAIN
          docker run --rm \
            -v "$SDL_CONTROL_SRC:/control-src" \
            -v "$SDL_CONTROL_BUILD:/control-build" \
            -w /control-build \
            devkitpro/devkitppc:latest \
            bash -lc '
              set -euo pipefail
              export DEVKITPRO=/opt/devkitpro
              export WUT_ROOT=/opt/devkitpro/wut
              /opt/devkitpro/portlibs/wiiu/bin/powerpc-eabi-cmake \
                -S /control-src -B /control-build -DCMAKE_BUILD_TYPE=Release
              cmake --build /control-build --parallel 2
              test -s /control-build/sdl2-control.rpx
            '
          cp "$SDL_CONTROL_BUILD/sdl2-control.rpx" "$RUNNER_TEMP/sdl2-control.rpx"
          sha256sum "$RUNNER_TEMP/sdl2-control.rpx"

      - name: Run SDL2 video control in Cemu and capture display
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cemu-test-output"
          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          export SDL_CONTROL_RPX="$RUNNER_TEMP/sdl2-control.rpx"
          export SDL_CONTROL_OUT="$RUNNER_TEMP/cemu-test-output"
          set +e
          timeout --signal=TERM --kill-after=5s 25s xvfb-run -a \
            --server-args="-screen 0 1280x720x24" \
            bash <<'SDL_CONTROL_SCRIPT'
              set -uo pipefail
              "$CEMU_BIN" -g "$SDL_CONTROL_RPX" --forward-console-logging \
                > "$SDL_CONTROL_OUT/sdl2-control-cemu.log" 2>&1 &
              CEMU_PID=$!
              echo "Started Cemu SDL2 control RPX (PID $CEMU_PID)"
              sleep 12
              if kill -0 "$CEMU_PID" 2>/dev/null; then
                import -window root -silent "$SDL_CONTROL_OUT/sdl2-control-after-12s.png" \
                  2> "$SDL_CONTROL_OUT/sdl2-control-screenshot-errors.log" || true
                kill -TERM "$CEMU_PID" 2>/dev/null || true
                sleep 2
                kill -KILL "$CEMU_PID" 2>/dev/null || true
                wait "$CEMU_PID" 2>/dev/null || true
              else
                wait "$CEMU_PID"
                status=$?
                echo "Cemu exited before SDL2 control screenshot (exit $status)"
                exit "$status"
              fi
          SDL_CONTROL_SCRIPT
          SDL_CONTROL_EXIT=$?
          set -e
          echo "SDL2 Cemu wrapper exit: $SDL_CONTROL_EXIT"
          if [ -f "$RUNNER_TEMP/cemu-test-output/sdl2-control-cemu.log" ]; then
            grep -Ein 'error|warning|fail|exception|crash|DRI3|Vulkan|OpenGL|SDL|GX2|unsupported' "$RUNNER_TEMP/cemu-test-output/sdl2-control-cemu.log" || true
          fi
          if [ -f "$RUNNER_TEMP/cemu-test-output/sdl2-control-after-12s.png" ]; then
            identify -format 'SDL2 control screenshot: %wx%h colors=%k mean=%[fx:mean] standard_deviation=%[fx:standard_deviation]\n' "$RUNNER_TEMP/cemu-test-output/sdl2-control-after-12s.png"
          else
            echo "No SDL2 control screenshot was captured."
          fi
          if [ "$SDL_CONTROL_EXIT" -ne 0 ]; then
            echo "::error::Cemu SDL2 control test wrapper failed."
            exit "$SDL_CONTROL_EXIT"
          fi
      - name: Launch RPX in Cemu and capture startup for 60 seconds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cemu-test-output"
          mapfile -t RPX_FILES < <(find wiiu-artifact -maxdepth 1 -type f -name '*.rpx' -print)
          if [ "${#RPX_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one RPX artifact, found ${#RPX_FILES[@]}."
            ls -la wiiu-artifact
            exit 1
          fi

          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          export CEMU_TEST_OUTPUT="$RUNNER_TEMP/cemu-test-output"
          export CEMU_SD_ROOT="$RUNNER_TEMP/cemu-sd"
          export RPX_TO_LAUNCH="${RPX_FILES[0]}"
          set +e
          timeout --signal=TERM --kill-after=8s 75s xvfb-run -a \
            --server-args="-screen 0 1280x720x24" \
            bash <<'CEMU_TEST_SCRIPT'
              set -uo pipefail
              LOG_PATH="$CEMU_TEST_OUTPUT/cemu.log"
              SCREENSHOT_ERRORS="$CEMU_TEST_OUTPUT/screenshot-errors.log"
              "$CEMU_BIN" -g "$RPX_TO_LAUNCH" \
                --cos-mounts "$CEMU_SD_ROOT:/vol/external01/" \
                --forward-console-logging > "$LOG_PATH" 2>&1 &
              CEMU_PID=$!
              echo "Started Cemu (PID $CEMU_PID) with RPX: $RPX_TO_LAUNCH"
              echo "Virtual SD mount: $CEMU_SD_ROOT -> /vol/external01/"
          
              sleep 2
              if import -window root -silent "$CEMU_TEST_OUTPUT/cemu-after-2s.png" 2>>"$SCREENSHOT_ERRORS"; then
                echo "Captured Cemu display after 2 seconds."
              else
                echo "Could not capture the 2-second screenshot; see screenshot-errors.log."
              fi

              sleep 3
              if import -window root -silent "$CEMU_TEST_OUTPUT/cemu-after-5s.png" 2>>"$SCREENSHOT_ERRORS"; then
                echo "Captured Cemu display after 5 seconds."
              else
                echo "Could not capture the 5-second screenshot; see screenshot-errors.log."
              fi

              sleep 10
              if ! kill -0 "$CEMU_PID" 2>/dev/null; then
                wait "$CEMU_PID"
                CEMU_STATUS=$?
                echo "Cemu exited before the 15-second screenshot (exit $CEMU_STATUS)."
                exit 1
              fi
              if import -window root -silent "$CEMU_TEST_OUTPUT/cemu-after-15s.png" 2>>"$SCREENSHOT_ERRORS"; then
                echo "Captured Cemu display after 15 seconds."
              else
                echo "Could not capture the 15-second screenshot; see screenshot-errors.log."
              fi

              sleep 30
              if ! kill -0 "$CEMU_PID" 2>/dev/null; then
                wait "$CEMU_PID"
                CEMU_STATUS=$?
                echo "Cemu exited before the second screenshot (exit $CEMU_STATUS)."
                exit 1
              fi
              if import -window root -silent "$CEMU_TEST_OUTPUT/cemu-after-45s.png" 2>>"$SCREENSHOT_ERRORS"; then
                echo "Captured Cemu display after 45 seconds."
              else
                echo "Could not capture the 45-second screenshot; see screenshot-errors.log."
              fi

              sleep 15
              if ! kill -0 "$CEMU_PID" 2>/dev/null; then
                wait "$CEMU_PID"
                CEMU_STATUS=$?
                echo "Cemu exited before completing the 60-second startup test (exit $CEMU_STATUS)."
                exit 1
              fi
              echo "Cemu remained alive for 60 seconds after the RPX launch."
              kill -TERM "$CEMU_PID" 2>/dev/null || true
              for attempt in 1 2 3 4 5; do
                if ! kill -0 "$CEMU_PID" 2>/dev/null; then break; fi
                sleep 1
              done
              kill -KILL "$CEMU_PID" 2>/dev/null || true
              wait "$CEMU_PID" 2>/dev/null || true
          CEMU_TEST_SCRIPT
          CEMU_TEST_EXIT=$?
          set -e

          if [ -f "$RUNNER_TEMP/cemu-test-output/cemu.log" ]; then
            cat "$RUNNER_TEMP/cemu-test-output/cemu.log"
          else
            echo "::error::Cemu did not create its startup log."
          fi

          if grep -E "psxrecomp: found game disc via SD-card (fallback|scan):" \
              "$RUNNER_TEMP/cemu-test-output/cemu.log" \
              > "$RUNNER_TEMP/cemu-test-output/disc-discovery.txt"; then
            echo "Runtime log confirms that a game disc was discovered from the virtual SD card:"
            cat "$RUNNER_TEMP/cemu-test-output/disc-discovery.txt"
          else
            echo "::warning::No explicit SD-card disc-discovery message appeared in Cemu's forwarded log. Inspect the uploaded log and screenshots."
          fi

          for shot in "$RUNNER_TEMP/cemu-test-output"/cemu-after-*.png; do
            [ -f "$shot" ] || continue
            file "$shot"
          done

          # Make the smoke test produce actionable evidence instead of treating
          # "the Cemu process stayed alive" as a successful game launch.
          LOG="$RUNNER_TEMP/cemu-test-output/cemu.log"
          {
            echo "=== Cemu process / launch summary ==="
            echo "Smoke-test wrapper exit: $CEMU_TEST_EXIT"
            echo "RPX: ${RPX_FILES[0]}"
            sha256sum "${RPX_FILES[0]}"
            echo
            echo "=== Cemu / graphics / RPX diagnostic lines ==="
            if [ -f "$LOG" ]; then
              grep -Ein 'error|warning|fail|exception|crash|DRI3|Vulkan|OpenGL|GX2|RPX|Cafe|unsupported|disc via SD-card|PSXRecomp|psxrecomp' "$LOG" \
                > "$RUNNER_TEMP/cemu-test-output/diagnostic-summary.txt" || true
              if [ -s "$RUNNER_TEMP/cemu-test-output/diagnostic-summary.txt" ]; then
                cat "$RUNNER_TEMP/cemu-test-output/diagnostic-summary.txt"
              else
                echo "No matching diagnostic keywords found; full log is still uploaded."
              fi
            fi
            echo
            echo "=== Screenshot image statistics ==="
            for shot in "$RUNNER_TEMP/cemu-test-output"/cemu-after-*.png; do
              [ -f "$shot" ] || continue
              echo "--- $shot"
              identify -format 'dimensions=%wx%h colors=%k mean=%[fx:mean] standard_deviation=%[fx:standard_deviation]\\n' "$shot" || true
              convert "$shot" -resize '1x1!' -format 'average_rgb=%[pixel:p{0,0}]\\n' info: || true
            done
          } | tee -a "$RUNNER_TEMP/cemu-test-output/diagnostic-summary.txt"

          if [ "$CEMU_TEST_EXIT" -ne 0 ]; then
            echo "::error::Cemu/RPX startup test failed (exit $CEMU_TEST_EXIT). See uploaded diagnostics."
            exit "$CEMU_TEST_EXIT"
          fi

      - name: Upload Cemu screenshots and startup logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cemu-WiiU-launch-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/cemu-test-output/
          if-no-files-found: warn
          retention-days: 14
