name: Experimental Wii U build

on:
  push:
    branches: [wiiu-port]
  pull_request:
    branches: [wiiu-port]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wiiu:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BUILD_JOBS: 2

    steps:
      - name: Check out game and pinned runtime
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install host, disc and Wii U toolchains
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build ccache pkg-config mame-tools \
            libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxtst-dev libxfixes-dev libxss-dev libwayland-dev \
            libxkbcommon-dev libasound2-dev libpulse-dev libudev-dev libdrm-dev libgbm-dev
          command -v chdman
          docker --version

      - name: Download and validate the original disc privately
        env:
          GAME_ASSETS_TOKEN: ${{ secrets.GAME_ASSETS_TOKEN }}
          GAME_ASSETS_REPO: NVDEMU/apeescapeprivateassets
          GAME_ASSETS_TAG: thing
          GAME_ASSETS_FILENAME: Ape.Escape.USA.chd
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ape-disc" apeescape
          python3 tools/download_disc.py "$RUNNER_TEMP/Ape Escape (USA).chd"
          chdman verify -i "$RUNNER_TEMP/Ape Escape (USA).chd"

      - name: Build the host recompiler and bundled OpenBIOS
        run: |
          set -euo pipefail
          cmake -S psxrecomp-v4/recompiler -B psxrecomp-v4/recompiler/build-wiiu-host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build psxrecomp-v4/recompiler/build-wiiu-host --parallel "$BUILD_JOBS" \
            --target psxrecomp-game psxrecomp-bios
          (cd psxrecomp-v4 && PSXRECOMP_BIOS_BUILD=recompiler/build-wiiu-host bash tools/regen_bios.sh --config bios/OpenBIOS.toml)

      - name: Prepare the disc and generate Ape Escape C translation
        run: |
          set -euo pipefail
          chdman extractcd \
            -i "$RUNNER_TEMP/Ape Escape (USA).chd" \
            -o "$RUNNER_TEMP/Ape Escape (USA).cue" \
            -ob "$RUNNER_TEMP/Ape Escape (USA).bin"
          python3 psxrecomp-v4/tools/prepare_disc.py "$RUNNER_TEMP/Ape Escape (USA).cue" --config game.toml
          test -s apeescape/SCUS_944.23
          psxrecomp-v4/recompiler/build-wiiu-host/psxrecomp-game --config game.toml
          test -s generated/SCUS_944.23_dispatch.c
          find generated -maxdepth 1 -type f -name 'SCUS_944.23_full*' -size +0c | grep -q .

      - name: Configure and compile native Wii U build in devkitPro container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            devkitpro/devkitppc:latest \
            bash -lc '
              set -euo pipefail
              # The bind-mounted checkout is owned by the host runner UID.
              # Explicitly trust this source tree so revision-pinned patch scripts
              # can verify the nested PSXRecomp submodule while running as container root.
              git config --global --add safe.directory /src
              git config --global --add safe.directory /src/psxrecomp-v4
              git -C /src/psxrecomp-v4 rev-parse --verify HEAD
              dkp-pacman -Syu --noconfirm
              dkp-pacman -S --needed --noconfirm wiiu-dev wiiu-sdl2
              export DEVKITPRO=/opt/devkitpro
              export WUT_ROOT=/opt/devkitpro/wut
              /opt/devkitpro/portlibs/wiiu/bin/powerpc-eabi-cmake \
                -S /src -B /src/build-wiiu \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_TESTING=OFF \
                -DPSX_RECOMP_UI:BOOL=OFF \
                -DPSX_SETUP_WIZARD:BOOL=OFF \
                -DAPE_WIIU_PORT=ON
              cmake --build /src/build-wiiu --parallel 2
            '

      - name: Verify and stage RPX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wiiu-artifact
          mapfile -t RPX_FILES < <(find build-wiiu -type f -name '*.rpx' -print)
          if [ "${#RPX_FILES[@]}" -eq 0 ]; then
            echo "::error::Build completed without producing a .rpx homebrew executable."
            find build-wiiu -maxdepth 5 -type f | sort | tail -n 100
            exit 1
          fi
          for file in "${RPX_FILES[@]}"; do
            cp "$file" "wiiu-artifact/$(basename "$file")"
          done
          cp docs/WIIU_PORT.md wiiu-artifact/README.txt
          sha256sum wiiu-artifact/*

      - name: Upload Wii U homebrew build
        uses: actions/upload-artifact@v4
        with:
          name: ApeEscapeRecomp-WiiU-${{ github.sha }}
          path: wiiu-artifact/*
          if-no-files-found: error
          retention-days: 14
